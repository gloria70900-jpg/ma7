<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXR Crystal Alchemy</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; color: white;}
        #ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle, #1a1a3a 0%, #000 100%); z-index: 100;
        }
        .upload-btn {
            position: relative; overflow: hidden; display: inline-block;
            padding: 20px 40px; background: linear-gradient(45deg, #0055ff, #00d4ff);
            color: white; font-size: 24px; font-weight: bold; border-radius: 50px;
            cursor: pointer; transition: transform 0.2s; box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
        }
        .upload-btn:hover { transform: scale(1.05); }
        .upload-btn input[type=file] {
            font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer;
        }
        #instructions { margin-top: 30px; text-align: center; line-height: 1.8; color: #ccc; }
        #loading { display: none; margin-top: 20px; font-size: 20px; color: #00d4ff; }
        
        #hud {
            position: absolute; top: 10px; width: 100%; text-align: center;
            pointer-events: none; z-index: 50; display: none; text-shadow: 0 0 5px #000; font-size: 18px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>Crystal Alchemy: The Blueprint</h1>
        <div class="upload-btn">
            <span>MP3 파일 선택하여 의식 시작</span>
            <input type="file" id="audioInput" accept="audio/*">
        </div>
        <div id="loading">오디오 분석 중... 잠시만 기다려주세요.</div>
        <div id="instructions">
            <strong>[조작 방법]</strong><br>
            <strong>PC:</strong> [좌클릭] = 180도 공중 분산 토글 / [우클릭] = 가루 파편 폭발 토글<br>
            <strong>VR 기기:</strong> [A / X 버튼] = 180도 분산 / [B / Y 버튼] = 가루 폭발<br>
            [조이스틱] = 물체 상하(원근) 및 좌우 이동
        </div>
    </div>

    <div id="hud">PC: 마우스 드래그로 회전 | 좌클릭: 분산 / 우클릭: 폭발 (현재 상태: CLUSTER)</div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, controls;
        let audioCtx, analyser, dataArray;
        
        // 상태 관리
        let currentState = 'CLUSTER'; 
        
        // 이동을 위한 전체 묶음 그룹 (조이스틱 원근 조절용)
        let worldGroup;

        // 수정 기둥(InstancedMesh) 변수
        const CRYSTAL_COUNT = 200;
        let crystalMesh, dummy;
        let currentPos = [], currentQuat = [];
        let clusterPos = [], clusterQuat = [];
        let dispersePos = [], disperseQuat = [];

        // 가루/파편(Points) 변수
        let particleSystem;
        const PARTICLE_COUNT = 20000;
        let pPositions, pVelocities;
        
        // 컨트롤러 버튼 상태 추적용
        const prevButtonState = { A: false, B: false };

        const clock = new THREE.Clock();

        // 30여 가지의 다양한 색상 팔레트 (명도와 채도 다양화)
        const crystalColors = [
            { h: 0.0, s: 0.9, l: 0.25 },  // 1. 선명한 빨강
            { h: 0.03, s: 0.8, l: 0.3 },  // 2. 다홍
            { h: 0.08, s: 0.9, l: 0.25 }, // 3. 선명한 주황
            { h: 0.11, s: 0.85, l: 0.35 },// 4. 귤색
            { h: 0.16, s: 0.9, l: 0.3 },  // 5. 노랑
            { h: 0.22, s: 0.8, l: 0.35 }, // 6. 연두
            { h: 0.33, s: 0.9, l: 0.25 }, // 7. 초록
            { h: 0.4, s: 0.85, l: 0.2 },  // 8. 청록
            { h: 0.5, s: 0.9, l: 0.3 },   // 9. 하늘
            { h: 0.6, s: 0.9, l: 0.2 },   // 10. 파랑
            { h: 0.65, s: 0.8, l: 0.25 }, // 11. 남색
            { h: 0.75, s: 0.9, l: 0.3 },  // 12. 보라
            { h: 0.85, s: 0.9, l: 0.3 },  // 13. 핑크
            { h: 0.92, s: 0.8, l: 0.35 }, // 14. 핫핑크
            { h: 0.0, s: 0.6, l: 0.4 },   // 15. 연한 빨강
            { h: 0.08, s: 0.7, l: 0.4 },  // 16. 연한 주황
            { h: 0.16, s: 0.6, l: 0.4 },  // 17. 연한 노랑
            { h: 0.33, s: 0.6, l: 0.4 },  // 18. 연한 초록
            { h: 0.5, s: 0.6, l: 0.4 },   // 19. 연한 하늘
            { h: 0.6, s: 0.6, l: 0.4 },   // 20. 파스텔 블루
            { h: 0.75, s: 0.6, l: 0.4 },  // 21. 라벤더 보라
            { h: 0.85, s: 0.6, l: 0.4 },  // 22. 연한 핑크
            { h: 0.0, s: 1.0, l: 0.15 },  // 23. 딥 레드
            { h: 0.1, s: 1.0, l: 0.15 },  // 24. 딥 오렌지
            { h: 0.33, s: 1.0, l: 0.15 }, // 25. 딥 그린
            { h: 0.6, s: 1.0, l: 0.15 },  // 26. 딥 블루
            { h: 0.75, s: 1.0, l: 0.15 }, // 27. 딥 퍼플
            { h: 0.85, s: 1.0, l: 0.15 }, // 28. 딥 핑크
            { h: 0.16, s: 1.0, l: 0.2 },  // 29. 짙은 황금
            { h: 0.5, s: 1.0, l: 0.2 }    // 30. 짙은 바다색
        ];

        // 현재 활성화된 색상 변수 (기본 파란색으로 시작)
        let currentHue = 0.6;
        let currentSat = 0.9;
        let currentLight = 0.2;

        initThreeJS();

        // --- 색상 랜덤화 함수 ---
        function randomizeCrystalColor() {
            const randIdx = Math.floor(Math.random() * crystalColors.length);
            currentHue = crystalColors[randIdx].h;
            currentSat = crystalColors[randIdx].s;
            currentLight = crystalColors[randIdx].l;
        }

        // --- MP3 파일 로드 ---
        document.getElementById('audioInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('loading').style.display = 'block';
            
            const reader = new FileReader();
            reader.onload = function(e) {
                initAudio(e.target.result);
            };
            reader.readAsArrayBuffer(file);
        });

        function initAudio(arrayBuffer) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.decodeAudioData(arrayBuffer, function(buffer) {
                const source = audioCtx.createBufferSource();
                source.buffer = buffer;
                
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                source.loop = true;
                source.start(0);
                
                document.getElementById('ui').style.display = 'none';
                document.getElementById('hud').style.display = 'block';
                document.body.appendChild(VRButton.createButton(renderer));
                
                animate();
            });
        }

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000511, 0.05);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 1); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 1.5, -3);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0x224488, 1.0);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0x00aaff, 5, 20);
            pointLight.position.set(0, 2, -2);
            scene.add(pointLight);

            // 전체 물체를 담을 그룹 (조이스틱으로 이동시키기 위함)
            worldGroup = new THREE.Group();
            scene.add(worldGroup);

            dummy = new THREE.Object3D();

            createCrystals();
            createParticles();

            window.addEventListener('contextmenu', (e) => e.preventDefault());
            
            window.addEventListener('mousedown', (e) => {
                if (e.button === 0) {
                    toggleDisperse();
                } else if (e.button === 2) {
                    toggleShatter();
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        function createCrystals() {
            const geometry = new THREE.OctahedronGeometry(0.3, 0);
            geometry.scale(0.8, 4.0, 0.8);

            // 빛을 잘 받기 위해 베이스 색상을 하얀색으로 세팅
            const material = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0x222222,
                roughness: 0.1,
                metalness: 0.8,
                transparent: true,
                opacity: 0.9
            });

            crystalMesh = new THREE.InstancedMesh(geometry, material, CRYSTAL_COUNT);
            worldGroup.add(crystalMesh);

            const centerPoint = new THREE.Vector3(0, 1.5, -4);

            for (let i = 0; i < CRYSTAL_COUNT; i++) {
                const phi = Math.acos(-1 + (2 * i) / CRYSTAL_COUNT);
                const theta = Math.sqrt(CRYSTAL_COUNT * Math.PI) * phi;
                
                let r = 1.0 + Math.random() * 0.5;
                let cx = r * Math.cos(theta) * Math.sin(phi);
                let cy = r * Math.sin(theta) * Math.sin(phi);
                let cz = r * Math.cos(phi);
                
                const cPos = new THREE.Vector3(cx, cy, cz).add(centerPoint);
                clusterPos.push(cPos);

                dummy.position.copy(centerPoint);
                dummy.lookAt(cPos);
                dummy.rotateX(Math.PI / 2);
                clusterQuat.push(dummy.quaternion.clone());

                const angle = (Math.random() - 0.5) * Math.PI;
                const radius = 3 + Math.random() * 4;
                const height = 0.5 + Math.random() * 3.5;

                const dPos = new THREE.Vector3(
                    Math.sin(angle) * radius,
                    height,
                    -Math.cos(angle) * radius
                );
                dispersePos.push(dPos);
                
                dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                disperseQuat.push(dummy.quaternion.clone());

                currentPos.push(cPos.clone());
                currentQuat.push(dummy.quaternion.clone());
            }
        }

        function createParticles() {
            const geo = new THREE.BufferGeometry();
            pPositions = new Float32Array(PARTICLE_COUNT * 3);
            pVelocities = new Float32Array(PARTICLE_COUNT * 3);
            
            geo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
            
            const mat = new THREE.PointsMaterial({
                color: 0xffffff, size: 0.05,
                transparent: true, opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geo, mat);
            particleSystem.visible = false;
            worldGroup.add(particleSystem);
        }

        function toggleDisperse() {
            if (currentState === 'SHATTERED') return; 
            
            if (currentState === 'CLUSTER') {
                currentState = 'DISPERSED';
            } else {
                currentState = 'CLUSTER';
                // 다시 중앙으로 모일 때마다 새로운 랜덤 색상 부여
                randomizeCrystalColor();
            }
            updateHUD();
        }

        function toggleShatter() {
            if (currentState !== 'SHATTERED') {
                currentState = 'SHATTERED';
                crystalMesh.visible = false;
                particleSystem.visible = true;
                
                for (let i = 0; i < CRYSTAL_COUNT; i++) {
                    const basePos = currentPos[i];
                    for (let j = 0; j < 100; j++) {
                        const idx = (i * 100 + j) * 3;
                        pPositions[idx] = basePos.x + (Math.random()-0.5)*0.5;
                        pPositions[idx+1] = basePos.y + (Math.random()-0.5)*0.5;
                        pPositions[idx+2] = basePos.z + (Math.random()-0.5)*0.5;
                        
                        pVelocities[idx] = (Math.random() - 0.5) * 15.0;
                        pVelocities[idx+1] = (Math.random() - 0.5) * 15.0;
                        pVelocities[idx+2] = (Math.random() - 0.5) * 15.0;
                    }
                }
            } else {
                currentState = 'CLUSTER';
                crystalMesh.visible = true;
                particleSystem.visible = false;
                // 다시 중앙으로 모일 때마다 새로운 랜덤 색상 부여
                randomizeCrystalColor();
            }
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('hud').innerText = `PC: 마우스 드래그로 회전 | 좌클릭: 180도 분산 / 우클릭: 폭발 (현재 상태: ${currentState})`;
        }

        // --- A/B 버튼 감지 및 조이스틱 이동 (원근/좌우) ---
        function handleGamepadInput() {
            const session = renderer.xr.getSession();
            if (!session) return;
            
            let currentA = false;
            let currentB = false;
            
            for (const source of session.inputSources) {
                if (!source.gamepad) continue;
                
                // 버튼 4번(A 또는 X), 5번(B 또는 Y)
                if (source.gamepad.buttons[4] && source.gamepad.buttons[4].pressed) currentA = true;
                if (source.gamepad.buttons[5] && source.gamepad.buttons[5].pressed) currentB = true;

                // 조이스틱을 이용한 원근(Z축) 및 좌우(X축) 이동
                if (source.gamepad.axes.length >= 4) {
                    const axesX = source.gamepad.axes[2]; // 조이스틱 좌우
                    const axesY = source.gamepad.axes[3]; // 조이스틱 상하
                    
                    // 데드존(미세한 흔들림 무시) 적용
                    if (Math.abs(axesX) > 0.1) {
                        worldGroup.position.x += axesX * 0.05; // 좌우 이동
                    }
                    if (Math.abs(axesY) > 0.1) {
                        worldGroup.position.z += axesY * 0.05; // 앞뒤 원근 이동
                    }
                }
            }

            // 버튼이 눌린 순간에만 토글 발생
            if (currentA && !prevButtonState.A) toggleDisperse();
            if (currentB && !prevButtonState.B) toggleShatter();

            prevButtonState.A = currentA;
            prevButtonState.B = currentB;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            controls.update();
            handleGamepadInput();

            let audioIntensity = 0;
            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i=0; i<30; i++) sum += dataArray[i];
                audioIntensity = sum / (30 * 255);
            }

            if (crystalMesh.visible) {
                for (let i = 0; i < CRYSTAL_COUNT; i++) {
                    const tPos = (currentState === 'CLUSTER') ? clusterPos[i] : dispersePos[i];
                    const tQuat = (currentState === 'CLUSTER') ? clusterQuat[i] : disperseQuat[i];

                    currentPos[i].lerp(tPos, delta * 3.0);
                    currentQuat[i].slerp(tQuat, delta * 3.0);

                    dummy.position.copy(currentPos[i]);
                    dummy.quaternion.copy(currentQuat[i]);
                    
                    const scale = 1.0 + audioIntensity * 0.5;
                    dummy.scale.set(scale, scale, scale);
                    
                    if (currentState === 'DISPERSED') {
                        dummy.position.y += Math.sin(time * 2 + i) * 0.02; 
                        dummy.rotateY(delta * 0.5);
                        currentQuat[i].copy(dummy.quaternion);
                    }

                    dummy.updateMatrix();
                    crystalMesh.setMatrixAt(i, dummy.matrix);
                    
                    // 선택된 랜덤 베이스 색상에 음악 반응성 결합
                    const color = new THREE.Color();
                    color.setHSL(currentHue, currentSat, currentLight + (audioIntensity * 0.6));
                    crystalMesh.setColorAt(i, color);
                }
                crystalMesh.instanceMatrix.needsUpdate = true;
                if(crystalMesh.instanceColor) crystalMesh.instanceColor.needsUpdate = true;
            }

            if (particleSystem.visible) {
                // 파편 색상도 현재 선택된 랜덤 색상에 맞춰 렌더링
                const pColor = new THREE.Color();
                pColor.setHSL(currentHue, currentSat, currentLight + 0.4);
                particleSystem.material.color = pColor;

                for (let i = 0; i < PARTICLE_COUNT; i++) {
                    let idx = i * 3;
                    
                    pPositions[idx] += pVelocities[idx] * delta;
                    pPositions[idx+1] += pVelocities[idx+1] * delta;
                    pPositions[idx+2] += pVelocities[idx+2] * delta;
                    
                    pVelocities[idx] *= 0.95;
                    pVelocities[idx+1] -= 0.1;
                    pVelocities[idx+2] *= 0.95;
                    
                    if (audioIntensity > 0.6) {
                        pVelocities[idx] += (Math.random() - 0.5) * 5.0;
                    }
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
